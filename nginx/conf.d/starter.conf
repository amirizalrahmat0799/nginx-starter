# Loaded inside the `http { }` block of /etc/nginx/nginx.conf (Ubuntu includes conf.d/*.conf there).
# Settings here apply to every site on this server.

# Don't reveal the exact Nginx version in error pages and the "Server" header.
server_tokens off;

# Used by snippets/proxy.conf for WebSockets:
# if the client asked to upgrade the connection, pass "upgrade" to the app, otherwise "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Settings for forwarding a request to an app (used with proxy_pass).

# HTTP/1.1 keeps connections to the app open and is required for WebSockets.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Without these, your app would think every request came from 127.0.0.1 over plain HTTP.
proxy_set_header Host              $host;                       # the domain the user typed
proxy_set_header X-Real-IP         $remote_addr;                # the user's real IP
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # chain of IPs through proxies
proxy_set_header X-Forwarded-Proto $scheme;                     # http or https
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
# Spring Boot: set server.forward-headers-strategy=framework so redirects and links use these.

# How long to wait for the app before giving up (504 Gateway Timeout).
proxy_connect_timeout 5s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;

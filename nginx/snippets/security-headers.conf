# Extra response headers that make browsers safer. Included at `server` level.
#
# Gotcha: add_header is inherited ONLY if the inner block has no add_header of its own.
# If you add an add_header inside a `location`, include this file there again.

# Don't guess file types; trust the Content-Type header.
add_header X-Content-Type-Options "nosniff" always;
# Don't allow other sites to show this one inside an <iframe> (clickjacking).
add_header X-Frame-Options "SAMEORIGIN" always;
# Send only the origin (not the full URL) when users click to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

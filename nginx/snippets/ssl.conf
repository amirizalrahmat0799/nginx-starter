# TLS settings for the self-signed setup.
# (With Let's Encrypt, certbot adds its own equivalent file instead.)

ssl_protocols TLSv1.2 TLSv1.3;          # older versions are insecure
ssl_prefer_server_ciphers off;          # modern clients pick well on their own
ssl_session_cache shared:SSL:10m;       # reuse TLS sessions: faster repeat visits
ssl_session_timeout 1d;
ssl_session_tickets off;
